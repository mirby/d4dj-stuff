name: Birthday notification

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 00:00 JST, i.e. 24h before the JST birthday starts
  workflow_dispatch:        # lets you run it manually to test

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/notify-birthdays.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}